# Runs the offline checks on every push and pull request: lint, and module load with Foundry and dnd5e mocked.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check
        run: |
          npm ci
          npm run check
